<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SoloSolar Layout</title>
  <style>
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      padding: 30px;
      margin: 0;
    }

    
    .main-wrapper {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 1200px;
      margin: 0 auto; 
    }

    
    .step-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px; 
    }

    
    .step-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    
    .step-box:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    
    .step-number {
      background-color: #e2e8f0;
      color: #64748b;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    
    .step-box small {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .step-box h4 {
      margin: 2px 0 0 0;
      font-size: 14px;
      color: #475569;
    }

    
    .step-box.active {
      background-color: #f0fdf4;
      border: 1.5px solid #86efac;
      box-shadow: 0 0 0 1px #86efac;
    }

    .step-box.active .step-number {
      background-color: #15803d;
      color: white;
    }

    .step-box.active small {
      color: #16a34a;
    }

    .step-box.active h4 {
      color: #0f172a;
    }

    
    .content-area {
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .content-title {
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 5px;
    }

    .content-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }

    
    @media (max-width: 900px) {
      .step-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  
  <div class="main-wrapper">
    
    <!-- The 4 Top Boxes -->
    <div class="step-container">
      <div class="step-box active" onclick="selectStep(this)">
        <span class="step-number">1</span>
        <div>
          <small>STEP 1</small>
          <h4>User & GPS</h4>
        </div>
      </div>

      <div class="step-box" onclick="selectStep(this)">
        <span class="step-number">2</span>
        <div>
          <small>STEP 2</small>
          <h4>Roof & Angles</h4>
        </div>
      </div>

      <div class="step-box" onclick="selectStep(this)">
        <span class="step-number">3</span>
        <div>
          <small>STEP 3</small>
          <h4>Solar API</h4>
        </div>
      </div>

      <div class="step-box" onclick="selectStep(this)">
        <span class="step-number">4</span>
        <div>
          <small>STEP 4</small>
          <h4>Quotes & Ads</h4>
        </div>
      </div>
    </div>

    
    <div class="content-area">
      <div class="content-title">ADD</div>
      <div class="content-subtitle">ADD</div>
      
      <!-- Put your form elements, inputs, grids here -->
      <p style="color: #64748b; font-size: 14px;">[ ADD ]</p>
    </div>

  </div>

  <script>
    function selectStep(element) {
      const allSteps = document.querySelectorAll('.step-box');
      allSteps.forEach(box => box.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
